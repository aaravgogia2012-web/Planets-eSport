<!DOCTYPE html>
<html>

<head>

<title>Planets Esport</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#00010a;
color:white;
overflow-x:hidden;
}


/* Galaxy */

.space{

position:fixed;
inset:0;
z-index:-10;

background:
radial-gradient(circle at 20% 20%,#7b2cff80,transparent 30%),
radial-gradient(circle at 80% 30%,#00eaff70,transparent 30%),
radial-gradient(circle at 50% 80%,#ff008060,transparent 35%),
linear-gradient(#01010a,#02031c);

animation:galaxy 20s infinite alternate;

}


@keyframes galaxy{

from{
transform:scale(1);
}

to{
transform:scale(1.2);
}

}


/* Moving stars */

.stars{

position:fixed;
inset:0;
z-index:-9;

background-image:
radial-gradient(white 1px,transparent 1px);

background-size:45px 45px;

opacity:.7;

animation:stars 30s linear infinite;

}


@keyframes stars{

from{
transform:translateY(0);
}

to{
transform:translateY(-400px);
}

}



/* Saturn */

.saturn{

position:fixed;

right:-90px;

top:100px;

width:250px;

height:250px;

border-radius:50%;

background:
radial-gradient(circle at 35% 35%,#fff2b0,#d89b30,#6b3700);

box-shadow:
0 0 100px #ffb300;

z-index:-5;

animation:saturnMove 8s infinite alternate;

}


.ring{

position:absolute;

width:400px;

height:120px;

left:-75px;

top:70px;

border-radius:50%;

border:22px solid #e5bd68;

transform:rotate(-20deg);

opacity:.9;

}


.ringFront{

position:absolute;

width:400px;

height:120px;

left:-75px;

top:85px;

border-radius:50%;

border-bottom:15px solid #fff0a0;

transform:rotate(-20deg);

}


@keyframes saturnMove{

from{
transform:translateY(0);
}

to{
transform:translateY(40px);
}

}



/* Earth */

.earth{

position:fixed;

left:50px;

top:170px;

width:100px;

height:100px;

border-radius:50%;

background:
linear-gradient(120deg,#0066ff,#00ff88,#003366);

box-shadow:
0 0 50px #00aaff;

animation:float 7s infinite alternate;

}


/* Mars */

.mars{

position:fixed;

left:100px;

bottom:100px;

width:70px;

height:70px;

border-radius:50%;

background:
radial-gradient(circle,#ff8866,#8b2200);

box-shadow:
0 0 40px red;

animation:float 6s infinite alternate;

}


/* Moon */

.moon{

position:fixed;

right:150px;

bottom:80px;

width:50px;

height:50px;

border-radius:50%;

background:#ddd;

box-shadow:
0 0 30px white;

}


@keyframes float{

from{
transform:translateY(0);
}

to{
transform:translateY(50px);
}

}



/* Header */

header{

text-align:center;

padding:50px 20px;

}


.logo{

font-size:60px;

font-weight:900;

letter-spacing:8px;

background:
linear-gradient(90deg,#00eaff,#ffffff,#00eaff);

-webkit-background-clip:text;

color:transparent;

text-shadow:
0 0 40px #00eaff;

}


.esport{

font-size:22px;

letter-spacing:15px;

color:#00eaff;

}



/* Glass UI */

.card{

width:90%;

max-width:750px;

margin:25px auto;

padding:30px;

background:
rgba(255,255,255,.10);

backdrop-filter:blur(15px);

border-radius:30px;

border:1px solid #00eaff70;

box-shadow:
0 0 50px #000;

text-align:center;

}


.card h2{

color:#00eaff;

margin-bottom:20px;

}


/* Buttons */

.button,
.modeBtn{

padding:15px 35px;

margin:10px;

border-radius:50px;

border:none;

cursor:pointer;

background:
linear-gradient(45deg,#0066ff,#00eaff);

color:white;

font-weight:bold;

text-decoration:none;

display:inline-block;

transition:.3s;

}


.button:hover,
.modeBtn:hover{

transform:scale(1.1);

box-shadow:
0 0 35px #00eaff;

}



.stats{

display:flex;

justify-content:center;

gap:15px;

flex-wrap:wrap;

}


.stat{

background:#0009;

padding:20px;

border-radius:20px;

min-width:130px;

}


.stat h3{

font-size:30px;

color:#00ff99;

}


.prize{

font-size:20px;

margin:12px;

}


footer{

text-align:center;

padding:30px;

color:#aaa;

}


</style>

</head>
